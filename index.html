<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zoo Sonoro - Sons dos Animais para Crianças</title>
  <meta name="description" content="Um site divertido e educativo com sons dos animais para crianças pequenas. Toque nos cards e ouça os bichinhos!">
  
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Decorative Bubbles -->
  <div class="bg-decorations" aria-hidden="true">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
  </div>

  <div class="app-container">
    <!-- Header section -->
    <header class="app-header">
      <div class="logo-container">
        <h1 class="app-title">Zoo Sonoro</h1>
      </div>
      <p class="app-subtitle">Toque no bichinho para ouvir o som dele!</p>
    </header>

    <main>
      <section class="animal-carousel" aria-label="Animais">
        <button id="previous-animal" class="carousel-arrow" type="button" aria-label="Animal anterior">&#8592;</button>
        <div class="carousel-content">
          <section id="animal-grid" class="animal-grid" aria-label="Animal atual" aria-live="polite">
            <!-- Rendered dynamically by script.js -->
          </section>
          <p id="animal-position" class="animal-position" aria-live="polite"></p>
        </div>
        <button id="next-animal" class="carousel-arrow" type="button" aria-label="Próximo animal">&#8594;</button>
      </section>
    </main>

    <section class="qr-section" aria-label="Acesso pelo celular">
      <h2>Acesse pelo celular</h2>
      <p>Aponte a câmera para o QR code e abra o Zoo Sonoro.</p>
      <a href="https://projeto-extencao.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Zoo Sonoro">
        <img
          class="site-qr-code"
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&format=svg&data=https%3A%2F%2Fprojeto-extencao.vercel.app%2F"
          alt="QR code para acessar projeto-extencao.vercel.app"
          width="220"
          height="220"
          loading="lazy"
        >
      </a>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Criado com carinho para crianças pequenas</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
